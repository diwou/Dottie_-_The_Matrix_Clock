; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = dottie_esp32s3

[env]
framework = arduino
extra_scripts =
	pre:scripts/version_label.py
	pre:scripts/silence_framework_warnings.py
lib_deps =
	majicdesigns/MD_MAX72XX@3.5.1
monitor_speed = 115200

[env:dottie_esp32s3]
platform = espressif32@6.13.0
board = dottie_esp32s3_wroom1_n16r8
upload_protocol = esptool
upload_speed = 460800
build_flags =
	-Wno-cpp
	-DDISPLAY_DATA_PIN=11
	-DDISPLAY_CLK_PIN=12
	-DDISPLAY_CS_PIN=10
	-DFACTORY_RESET_PIN=0
	-DI2C_SDA_PIN=8
	-DI2C_SCL_PIN=9

[env:dottie_esp32s3_ota]
extends = env:dottie_esp32s3
upload_protocol = espota

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-Wno-cpp
	-DDISPLAY_DATA_PIN=D7
	-DDISPLAY_CLK_PIN=D5
	-DDISPLAY_CS_PIN=D2
	-DFACTORY_RESET_PIN=D0
upload_protocol = esptool
upload_speed = 115200
upload_port = /dev/ttyUSB0

[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
